<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Pharmacy Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/PharmacyManagmentSystem.css">
</head>

<body>

  <div class="title"><i class="bi bi-heart-pulse-fill"></i> Pharmacy Management System</div>

  <div class="search-container">
    <div>
      <i class="bi bi-search"></i>
      <input id="searchInput" placeholder="Search medicine name">
    </div>
  </div>

  <div class="filter-card">
    <div class="filters">
      <div class="filter-group"><label><i class="bi bi-key-fill"></i>ID</label><input id="idFilter"></div>
      <div class="filter-group"><label><i class="bi bi-tags-fill"></i>Category</label>
        <select id="categoryFilter">
          <option value="">All</option>
        </select>
      </div>
      <div class="filter-group"><label><i class="bi bi-box2-fill"></i>Shelf</label>
        <select id="shelfFilter">
          <option value="">All</option>
        </select>
      </div>
      <div class="filter-group"><label><i class="bi bi-stack"></i>Stock</label>
        <select id="stockFilter">
          <option value="">All</option>
          <option value="in">In Stock</option>
          <option value="out">Out Stock</option>
        </select>
      </div>
      <div class="filter-group"><label><i class="bi bi-calculator-fill"></i>Min Quantity</label><input id="quantityFilter"></div>
      <div class="filter-group"><label><i class="bi bi-calculator-fill"></i>Max Quantity</label><input id="maxQuantityFilter"></div>
      <div class="filter-group"><label><i class="bi bi-calendar-event-fill"></i>Expiration Date</label><input type="date" id="expiryFilter"></div>
      <div class="filter-group"><label><i class="bi bi-cash-stack"></i>Min Price</label><input id="minPriceFilter"></div>
      <div class="filter-group"><label><i class="bi bi-cash-stack"></i>Max Price</label><input id="maxPriceFilter"></div>
    </div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Manufacturer</th>
          <th>Category</th>
          <th>Shelf</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Expiration Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="medicineTable"></tbody>
    </table>
  </div>

  <script src="js/PharmacyManagmentSystem.js"></script>

</body>

</html>
